<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full-Bleed Background for Maskable Icon Safe Zone -->
  <rect width="512" height="512" fill="url(#brand-grad)" />

  <!-- Inner Document & Conversion Arrows Graphic centered within 75% safe area -->
  <g transform="translate(126, 126) scale(0.85)" filter="url(#shadow)">
    <!-- Document Card Base -->
    <path d="M 40 30 C 40 18.95 48.95 10 60 10 L 190 10 L 260 80 L 260 270 C 260 281.05 251.05 290 240 290 L 60 290 C 48.95 290 40 281.05 40 270 Z" fill="#ffffff" fill-opacity="0.96" />
    <!-- Folded Corner -->
    <path d="M 190 10 L 190 80 L 260 80 Z" fill="#dbeafe" />

    <!-- Document Lines -->
    <rect x="75" y="70" width="85" height="12" rx="6" fill="#93c5fd" />
    <rect x="75" y="105" width="150" height="10" rx="5" fill="#cbd5e1" />
    <rect x="75" y="130" width="130" height="10" rx="5" fill="#cbd5e1" />

    <!-- Center Badge / Circle with Arrows -->
    <circle cx="150" cy="205" r="56" fill="#2563eb" />
    
    <!-- Exchange Arrows -->
    <path d="M 125 195 L 165 195 M 155 185 L 167 195 L 155 205" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 175 215 L 135 215 M 145 225 L 133 215 L 145 205" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
